---
name: Tag Release

# The `name:` above MUST stay exactly "Tag Release" — publish-release.yml's
# `workflow_run.workflows: ["Tag Release"]` trigger matches on this name, not
# on the reusable workflow's own name.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

jobs:
  tag:
    permissions:
      contents: write
    # 2026-11-10, qte77/.github@43ad121. Defaults (version_file: pyproject.toml,
    # tag_prefix: v, version_regex: ^version = "(.*)") already match this repo's
    # [project] version = "x.y.z" line — no overrides needed.
    uses: qte77/.github/.github/workflows/tag-release.yml@a32769a925e4d056b5d389ad727f7831973f7161  # main 2026-11-12 (qte77/.github#64)
