---
name: Update Timeline

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated owner/repo pairs (optional, falls back to vars.TIMELINE_REPOS)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write  # read for the collectors, write for the failure issue

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./
        with:
          REPOS: ${{ github.event.inputs.repos || vars.TIMELINE_REPOS || 'qte77/gha-arbitrary-repo-timeline' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Weekly schedule, two-week lookback: one missed run backfills itself.
          DAYS: '14'
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Auto-merged snapshot PRs keep their branch (delete_branch_on_merge does not
          # fire for the GITHUB_TOKEN-queued auto-merge), so sweep every leftover
          # auto-timeline-* branch that has no open PR, on every run.
          OPEN_HEADS=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref')
          for REF in $(gh api "repos/$REPO/git/matching-refs/heads/auto-timeline-" \
            --jq '.[].ref | ltrimstr("refs/heads/")'); do
            grep -qxF "$REF" <<<"$OPEN_HEADS" || gh api -X DELETE "repos/$REPO/git/refs/heads/$REF"
          done
          git add timelines/ assets/
          git diff --cached --quiet && echo "No changes" && exit 0
          # Each run is a full snapshot, so any still-open snapshot PR is superseded.
          for OLD in $(gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("auto-timeline-")) | .number'); do
            gh pr close "$OLD" -R "$REPO" --delete-branch -c "Superseded by a newer timeline snapshot."
          done
          DATE=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="auto-timeline-$DATE"
          BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/$REPO/git/commits/$BASE_SHA" --jq '.tree.sha')
          # File contents go inline in the one "Create a tree" request, which writes
          # every blob itself: one content-creating request instead of one per file
          # (GitHub allows 80 per minute). Inline content is text; the generator only
          # writes .md, .svg and .tsv files.
          echo '[]' > /tmp/tree_entries.json
          for file in $(git diff --cached --name-only); do
            jq --arg path "$file" --rawfile content "$file" \
              '. + [{"path": $path, "mode": "100644", "type": "blob", "content": $content}]' \
              /tmp/tree_entries.json > /tmp/tree_entries_tmp.json && mv /tmp/tree_entries_tmp.json /tmp/tree_entries.json
          done
          NEW_TREE=$(gh api "repos/$REPO/git/trees" \
            --input <(jq -n --arg base "$BASE_TREE" --slurpfile tree /tmp/tree_entries.json \
              '{base_tree: $base, tree: $tree[0]}') --jq '.sha')
          # Neither author nor committer is set, so GitHub creates the commit as the token's
          # identity (github-actions[bot]) and signs it, so it passes the ruleset's
          # required_signatures. A custom author/committer stops GitHub from signing.
          COMMIT_SHA=$(gh api "repos/$REPO/git/commits" \
            --input <(jq -n --arg msg "chore: update timelines" --arg tree "$NEW_TREE" --arg parent "$BASE_SHA" \
              '{message: $msg, tree: $tree, parents: [$parent]}') --jq '.sha')
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$COMMIT_SHA"
          PR_NUM=$(gh api "repos/$REPO/pulls" \
            -f title="chore: update timelines" \
            -f body="Auto-generated by update-timeline workflow." \
            -f head="$BRANCH" -f base=main --jq '.number')
          # Required checks (CodeFactor) haven't reported yet, so an immediate merge is
          # rejected by the ruleset. Auto-merge waits for them; the next run's sweep
          # (top of this step) deletes the merged branch.
          gh pr merge "$PR_NUM" --auto --squash -R "$REPO" --subject "chore: update timelines"
      # The 14-day lookback absorbs one missed weekly run, not two, so a failure is
      # surfaced as one open tracking issue (later failures add a comment to it).
      - name: Open or update an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Timeline update failed"
          NUM=$(gh issue list -R "$REPO" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq '[.[] | select(.title == "Timeline update failed")][0].number // empty')
          if [[ -n "$NUM" ]]; then
            gh issue comment "$NUM" -R "$REPO" --body "Failed again: $RUN_URL"
          else
            gh issue create -R "$REPO" --title "$TITLE" \
              --body "The scheduled timeline update failed: $RUN_URL. Close this issue once a run succeeds."
          fi
      - name: Report remaining API budget
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # rate_limit itself does not count against the budget.
        run: |
          gh api rate_limit --jq '.resources.core | "REST core: \(.remaining)/\(.limit) left, resets \(.reset | todate)"'
...
