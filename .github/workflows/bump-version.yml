---
name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '[major|minor|patch]'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'

jobs:
  bump:
    permissions:
      contents: write
      pull-requests: write
    # 2026-11-10, qte77/.github@43ad121 (verified against this repo's own
    # pyproject.toml: no uv, no scriv/changelog.d/ — both stay off)
    uses: qte77/.github/.github/workflows/bump-version.yml@43ad1211e962f82fab823377dcc7272054d8196c
    with:
      bump_type: ${{ inputs.bump_type }}
      use_uv: false
      sync_lockfile: false
      collect_scriv: false
...
