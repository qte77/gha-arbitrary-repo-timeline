# https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action
name: "Arbitrary Repo Timeline"
description: "Generate a timeline from issues, PRs, and git log across arbitrary repos."
author: "qte77"
branding:
  icon: "clock"
  color: "blue"
inputs:
  REPOS:
    description: "Comma-separated list of owner/repo pairs to monitor. An entry with no '/' is treated as an account (user or organization) login and produces an account-level repo lifespan timeline instead of a per-repo one."
    required: true
  OUTPUT_FILE:
    description: "Path to write timeline markdown."
    default: "TIMELINE.md"
  TOKEN:
    description: "GitHub token with read access to monitored repos."
    default: ""
  INCLUDE_GIT_LOG:
    description: "Include recent git log entries in timeline."
    default: "false"
  DAYS:
    description: "Number of days to look back."
    default: "7"
  INCLUDE_CONTRIBUTORS:
    description: "Include aggregated contributor activity in the timeline. Requires the host repo to be private or internal (enforced at runtime)."
    default: "false"
  INCLUDE_CONTRIBUTOR_PROFILE_DETAILS:
    description: "Include self-reported profile fields (location, company, bio) for contributors at/above the activity threshold. Requires INCLUDE_CONTRIBUTORS=true."
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 1
        token: ${{ inputs.TOKEN || github.token }}

    - name: Generate timeline
      shell: bash
      env:
        INPUT_REPOS: ${{ inputs.REPOS }}
        INPUT_OUTPUT_FILE: ${{ inputs.OUTPUT_FILE }}
        INPUT_INCLUDE_GIT_LOG: ${{ inputs.INCLUDE_GIT_LOG }}
        INPUT_DAYS: ${{ inputs.DAYS }}
        INPUT_INCLUDE_CONTRIBUTORS: ${{ inputs.INCLUDE_CONTRIBUTORS }}
        INPUT_INCLUDE_CONTRIBUTOR_PROFILE_DETAILS: ${{ inputs.INCLUDE_CONTRIBUTOR_PROFILE_DETAILS }}
        INPUT_REPO_VISIBILITY: ${{ github.repository_visibility }}
        GH_TOKEN: ${{ inputs.TOKEN || github.token }}
      run: |
        chmod +x "${{ github.action_path }}/scripts/"*.sh
        source "${{ github.action_path }}/scripts/common.sh"
        "${{ github.action_path }}/scripts/generate-timeline.sh"
